<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 - 文彩空间</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav" id="nav"></nav>

  <header class="page-hero">
    <div class="container">
      <h1 id="aboutTitle">关于我</h1>
      <p id="aboutSubtitle"></p>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="about-intro" id="aboutIntro"></div>
    </div>
  </section>

  <section class="section" style="background:#fff;border-top:1px solid var(--line)">
    <div class="container">
      <div class="section-head"><h2>坚持的价值</h2></div>
      <div class="value-grid" id="values"></div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
  <script>
    WC.renderNav('about');
    WC.load().then(d => {
      document.title = `${d.about.title} - ${d.site.name}`;
      document.getElementById('aboutTitle').textContent = d.about.title;
      document.getElementById('aboutSubtitle').textContent = d.about.subtitle;
      document.getElementById('aboutIntro').textContent = d.about.intro;
      document.getElementById('values').innerHTML = (d.about.values || []).map((v, i) =>
        `<div class="value-card"><div class="idx">0${i + 1}</div><h3>${WC.esc(v.title)}</h3><p>${WC.esc(v.desc)}</p></div>`).join('');
      WC.renderFooter(d);
    });
  </script>
</body>
</html>
